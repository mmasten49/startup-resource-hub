<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alloy Growth Lab Hubs</title>
  <link rel="icon" type="image/png" href="startup-hub/assets/alloy-logo-square.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    body { margin: 0; background: #FBF6EE; color: #14110F; font-family: 'Inter', system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px; text-align: center; }
    img { height: 40px; margin-bottom: 32px; }
    h1 { font-family: 'Sora', sans-serif; font-weight: 800; font-size: clamp(28px, 5vw, 40px); margin: 0 0 32px; }
    .links { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    a { display: block; background: #fff; border: 1px solid rgba(20,17,15,.1); border-radius: 18px; padding: 24px; color: inherit; text-decoration: none; transition: border-color .15s; }
    a:hover { border-color: #FF9900; }
    strong { display: block; font-family: 'Sora', sans-serif; font-size: 18px; margin-bottom: 6px; }
    span { color: #5C554D; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <img src="startup-hub/assets/alloy-logo-wide.png" alt="Alloy Growth Lab" />
    <h1>Founder resources from Alloy Growth Lab</h1>
    <div class="links">
      <a href="startup-hub/"><strong>Startup Resource Hub</strong><span>90+ vetted guides, templates, and tools</span></a>
      <a href="grant-finder/"><strong>Small-Business Grant Finder</strong><span>Grants open for applications now</span></a>
    </div>
  </main>
</body>
</html>
